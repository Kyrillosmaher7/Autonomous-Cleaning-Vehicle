# V1 - static, fully observable environment.
# The agent sees the complete State (position, dirt, battery).

version: v1
name: "V1 - Static environment"
description: "Fully observable grid, fixed dirt, battery and charger."
status: available          # available | planned (planned = hidden in the UI)

environment:
  grid:
    rows: 10
    cols: 10
  start_position: [0, 0]
  charging_station: [0, 0]
  static_obstacles: []
  battery:
    max: 50
    initial: 50
    low_threshold: 5
  dirt:
    initial_cells: [[1, 1], [3, 3], [5, 5]]
    spawn_probability: 0.0   # 0 = dirt never appears again
    max_dirty_cells: null    # null = no cap
  dynamic_obstacles:
    positions: []
    move_probability: 0.0
  observation:
    mode: full               # full | partial
    radius: 1                # only used when mode = partial
  rewards:
    clean: 10.0
    move: -1.0
    invalid: -2.0
    completion: 20.0
    charging: 1.0
    low_battery: -1.0

training:
  max_steps: 100
